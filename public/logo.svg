<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Peça Pronta">
  <!-- Fundo: gradiente azul brand -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4fc7" />
      <stop offset="100%" stop-color="#11245a" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Letra P estilizada (Peça) -->
  <path
    d="M16 14 V50 M16 14 H35 A11 11 0 0 1 35 36 H16"
    stroke="#ffffff"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Check + sparkle (Pronta · IA) -->
  <circle cx="46" cy="46" r="10" fill="url(#checkGrad)" />
  <path
    d="M41.5 46.5 L45 50 L51 41.5"
    stroke="#ffffff"
    stroke-width="2.6"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Mini sparkle indicando IA -->
  <g transform="translate(50 16)" fill="#f59e0b">
    <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" />
  </g>
</svg>
