<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4fc7" />
      <stop offset="60%" stop-color="#1a3f9b" />
      <stop offset="100%" stop-color="#11245a" />
    </linearGradient>
    <linearGradient id="checkL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowL" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.30" />
    </filter>
    <clipPath id="clipFrameL">
      <rect width="1200" height="630" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipFrameL)">
    <rect width="1200" height="630" fill="url(#bgL)" />

    <!-- Blobs -->
    <circle cx="1150" cy="50" r="200" fill="#10b981" opacity="0.18" />
    <circle cx="80" cy="600" r="240" fill="#f59e0b" opacity="0.12" />
    <circle cx="600" cy="-50" r="180" fill="#ffffff" opacity="0.05" />

    <!-- Faixa "ASSINATURA MENSAL" no topo -->
    <g transform="translate(80 60)">
      <rect width="240" height="36" rx="18" fill="#f59e0b" />
      <circle cx="22" cy="18" r="4" fill="#0f172a" />
      <text x="120" y="24" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">
        ASSINATURA MENSAL
      </text>
    </g>

    <!-- Logomark gigante -->
    <g transform="translate(80 140)" filter="url(#shadowL)">
      <rect width="200" height="200" rx="44" fill="#ffffff" opacity="0.15" />
      <path
        d="M55 45 V155 M55 45 H110 A33 33 0 0 1 110 110 H55"
        stroke="#ffffff"
        stroke-width="17"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="142" cy="142" r="30" fill="url(#checkL)" />
      <path
        d="M129 142 L140 152 L156 128"
        stroke="#ffffff"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <g transform="translate(157 55)" fill="#f59e0b">
        <path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" />
      </g>
    </g>

    <!-- Wordmark + tagline -->
    <g transform="translate(330 200)">
      <text x="0" y="0" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
        Peça Pronta
      </text>
      <text x="0" y="48" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4">
        ASSISTENTE JURÍDICO COM IA
      </text>
    </g>

    <!-- Headline grande -->
    <g transform="translate(330 320)">
      <text x="0" y="0" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
        Petições em até
      </text>
      <text x="0" y="60" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="900" letter-spacing="-2">
        30 segundos.
      </text>
    </g>

    <!-- 4 features -->
    <g transform="translate(80 480)" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
      <g transform="translate(0 0)">
        <circle cx="14" cy="14" r="14" fill="#34d399" />
        <path d="M8 14 L12 18 L20 9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="20">30 tipos de peça</text>
      </g>
      <g transform="translate(260 0)">
        <circle cx="14" cy="14" r="14" fill="#34d399" />
        <path d="M8 14 L12 18 L20 9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="20">Biblioteca premium</text>
      </g>
      <g transform="translate(540 0)">
        <circle cx="14" cy="14" r="14" fill="#34d399" />
        <path d="M8 14 L12 18 L20 9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="20">Revisor com IA</text>
      </g>
      <g transform="translate(800 0)">
        <circle cx="14" cy="14" r="14" fill="#34d399" />
        <path d="M8 14 L12 18 L20 9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="38" y="20">Calculadoras</text>
      </g>
    </g>

    <!-- Selo de preço -->
    <g transform="translate(950 540)">
      <rect x="0" y="0" width="180" height="60" rx="14" fill="#f59e0b" />
      <text x="90" y="26" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        A PARTIR DE
      </text>
      <text x="90" y="50" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">
        R$ 19,90/mês
      </text>
    </g>
  </g>
</svg>
