<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4fc7" />
      <stop offset="60%" stop-color="#1a3f9b" />
      <stop offset="100%" stop-color="#11245a" />
    </linearGradient>
    <linearGradient id="checkSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowSq" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <clipPath id="clipFrameSq">
      <rect width="600" height="600" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipFrameSq)">
    <!-- Fundo gradiente -->
    <rect width="600" height="600" fill="url(#bgSq)" />

    <!-- Blobs decorativos -->
    <circle cx="560" cy="60" r="120" fill="#10b981" opacity="0.15" />
    <circle cx="60" cy="560" r="150" fill="#f59e0b" opacity="0.10" />

    <!-- Logomark centralizado -->
    <g transform="translate(180 140)" filter="url(#shadowSq)">
      <rect width="240" height="240" rx="50" fill="#ffffff" />
      <path
        d="M70 60 V180 M70 60 H130 A38 38 0 0 1 130 134 H70"
        stroke="#1e4fc7"
        stroke-width="20"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="168" cy="168" r="34" fill="url(#checkSq)" />
      <path
        d="M153 168 L165 180 L184 152"
        stroke="#ffffff"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <g transform="translate(186 68)" fill="#f59e0b">
        <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z" />
      </g>
    </g>

    <!-- Wordmark embaixo -->
    <text x="300" y="450" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
      Peça Pronta
    </text>
    <text x="300" y="490" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="3" text-anchor="middle">
      ASSISTENTE JURÍDICO COM IA
    </text>
  </g>
</svg>
