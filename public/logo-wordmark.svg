<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="Peça Pronta">
  <defs>
    <linearGradient id="bgGradW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4fc7" />
      <stop offset="100%" stop-color="#11245a" />
    </linearGradient>
    <linearGradient id="checkGradW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Logomark à esquerda -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGradW)" />
    <path
      d="M16 14 V50 M16 14 H35 A11 11 0 0 1 35 36 H16"
      stroke="#ffffff"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="46" cy="46" r="10" fill="url(#checkGradW)" />
    <path
      d="M41.5 46.5 L45 50 L51 41.5"
      stroke="#ffffff"
      stroke-width="2.6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <g transform="translate(50 16)" fill="#f59e0b">
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" />
    </g>
  </g>

  <!-- Wordmark "Peça Pronta" -->
  <g transform="translate(78 0)" fill="#0f172a" font-family="Inter, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="30" font-size="22" font-weight="700" letter-spacing="-0.5">Peça</text>
    <text x="0" y="54" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#1e4fc7">Pronta</text>
  </g>

  <!-- Tagline opcional -->
  <text x="170" y="38" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="500" letter-spacing="1">
    ASSISTENTE JURÍDICO
  </text>
  <text x="170" y="50" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="500" letter-spacing="1">
    COM IA
  </text>
</svg>
