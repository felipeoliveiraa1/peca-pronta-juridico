<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4fc7" />
      <stop offset="60%" stop-color="#1a3f9b" />
      <stop offset="100%" stop-color="#11245a" />
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <clipPath id="clipFrame">
      <rect width="300" height="250" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipFrame)">
    <!-- Fundo principal -->
    <rect width="300" height="250" fill="url(#bg)" />

    <!-- Blobs decorativos (dentro do clipPath, não vazam) -->
    <circle cx="280" cy="10" r="55" fill="#10b981" opacity="0.18" />
    <circle cx="20" cy="240" r="65" fill="#f59e0b" opacity="0.12" />

    <!-- Logomark grande centralizado verticalmente, à esquerda -->
    <g transform="translate(28 70)" filter="url(#shadow)">
      <rect width="80" height="80" rx="18" fill="#ffffff" opacity="0.15" />
      <path
        d="M22 18 V62 M22 18 H44 A13 13 0 0 1 44 44 H22"
        stroke="#ffffff"
        stroke-width="7"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="57" cy="57" r="12" fill="url(#check)" />
      <path
        d="M52 57 L56 61 L62 51"
        stroke="#ffffff"
        stroke-width="2.8"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <g transform="translate(63 22)" fill="#f59e0b">
        <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" />
      </g>
    </g>

    <!-- Wordmark -->
    <text x="124" y="100" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
      Peça
    </text>
    <text x="124" y="130" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
      Pronta
    </text>

    <!-- Tagline (com margem extra das bordas) -->
    <text x="60" y="220" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle" dx="90">
      ASSISTENTE JURÍDICO COM IA
    </text>
  </g>
</svg>
